services:
  - type: web
    name: flowboard-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build --workspace @flowboard/api
    startCommand: npm run start --workspace @flowboard/api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_NAME
        value: flowboard_session
      - key: AUTH_TOKEN_TTL
        value: 7d
      - key: TRUST_PROXY_HOPS
        value: 1
